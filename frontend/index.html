<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Core Interface</title>
    <script src="three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030201;
            color: #ffaa33;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Navigation Header */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-container {
            display: flex;
            gap: 28px;
            background: rgba(20, 10, 2, 0.75);
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 140, 0, 0.4);
            box-shadow: 0 0 25px rgba(255, 120, 0, 0.25), inset 0 0 12px rgba(255, 100, 0, 0.15);
            backdrop-filter: blur(12px);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ff9922;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background: rgba(255, 140, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 150, 0, 0.7);
            text-shadow: 0 0 8px #ffcc44;
            transform: translateY(-1px);
        }

        .nav-icon {
            font-size: 14px;
        }

        /* Center Status / Gesture / Speaking HUD */
        .status-badge {
            position: absolute;
            top: 85px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .ai-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffb733;
            text-shadow: 0 0 15px rgba(255, 150, 0, 0.8), 0 0 30px rgba(255, 100, 0, 0.5);
            text-transform: uppercase;
        }

        .ai-state {
            font-size: 12px;
            letter-spacing: 2px;
            color: #ff8800;
            font-weight: 600;
            background: rgba(255, 100, 0, 0.12);
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            text-shadow: 0 0 5px rgba(255, 120, 0, 0.5);
            transition: all 0.3s ease;
        }

        .ai-state.speaking {
            color: #ffffff;
            background: rgba(255, 150, 0, 0.45);
            border-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255, 180, 0, 0.9);
            text-shadow: 0 0 10px #ffffff;
            animation: pulse-speaking 0.7s infinite alternate;
        }

        .ai-state.gesture-active {
            color: #ffeedd;
            background: rgba(255, 60, 0, 0.5);
            border-color: #ff5500;
            box-shadow: 0 0 30px rgba(255, 80, 0, 0.9);
            text-shadow: 0 0 10px #ffaa00;
        }

        @keyframes pulse-speaking {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 150, 0, 0.6); }
            100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(255, 200, 50, 0.9); }
        }

        /* Floating HUD & Bottom Command Bar */
        .bottom-hud {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
            padding: 0 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .voice-output-bubble {
            width: 100%;
            background: rgba(15, 8, 2, 0.8);
            border: 1px solid rgba(255, 140, 0, 0.4);
            border-radius: 16px;
            padding: 14px 20px;
            color: #ffdd99;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.8px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 100, 0, 0.2), inset 0 0 15px rgba(255, 100, 0, 0.1);
            backdrop-filter: blur(14px);
            transition: all 0.3s ease;
        }

        .voice-output-bubble.active {
            border-color: #ffaa00;
            box-shadow: 0 0 35px rgba(255, 160, 0, 0.5);
            color: #ffffff;
        }

        .input-bar-container {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .cmd-input {
            flex: 1;
            background: rgba(20, 10, 2, 0.9);
            border: 1px solid rgba(255, 140, 0, 0.45);
            border-radius: 30px;
            padding: 14px 24px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.15);
            transition: all 0.3s ease;
        }

        .cmd-input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 25px rgba(255, 150, 0, 0.45);
        }

        .action-btn {
            background: linear-gradient(135deg, #ff8800, #ff4400);
            border: none;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.5);
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 150, 0, 0.8);
        }

        .mic-btn {
            background: rgba(30, 15, 3, 0.85);
            border: 1px solid rgba(255, 140, 0, 0.5);
            color: #ffaa33;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.2);
            transition: all 0.3s ease;
        }

        .mic-btn:hover, .mic-btn.recording {
            color: #ffffff;
            background: #ff5500;
            border-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255, 120, 0, 0.8);
            transform: scale(1.08);
        }

        /* Heart indicator */
        .corner-heart {
            position: absolute;
            bottom: 24px;
            right: 28px;
            color: rgba(255, 150, 0, 0.5);
            font-size: 22px;
            z-index: 10;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .corner-heart:hover {
            color: #ff5500;
            text-shadow: 0 0 20px #ff5500;
            transform: scale(1.25);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <!-- Top Navigation Header -->
    <header>
        <div class="nav-container">
            <div class="nav-item active" onclick="setTab('home')">
                <span class="nav-icon">☖</span> Home
            </div>
            <div class="nav-item" onclick="setTab('chat')">
                <span class="nav-icon">💬</span> Chat
            </div>
            <div class="nav-item" onclick="setTab('dashboard')">
                <span class="nav-icon">📊</span> Dashboard
            </div>
        </div>
    </header>

    <!-- Center AI State & Gesture Indicator -->
    <div class="status-badge">
        <div class="ai-title">J.A.R.V.I.S. CORE</div>
        <div id="ai-state-indicator" class="ai-state">SYSTEM READY ● ONLINE</div>
    </div>

    <!-- Bottom HUD & Command Bar -->
    <div class="bottom-hud">
        <div id="voice-response" class="voice-output-bubble">
            "Namaste Shivam! Main taiyar hu, boliye kya karu?"
        </div>
        <div class="input-bar-container">
            <input type="text" id="cmd-input" class="cmd-input" placeholder="Boliye ya type karein (e.g. Open Edge, Minimize, YouTube)..." onkeydown="handleKey(event)" />
            <button class="mic-btn" id="mic-toggle" onclick="toggleVoiceMode()" title="Toggle Voice Recognition">🎙️</button>
            <button class="action-btn" onclick="sendCommand()">EXECUTE</button>
        </div>
    </div>

    <div class="corner-heart" onclick="triggerSplitDemo()">♡</div>

    <script>
        // ── Three.js Golden Arc Reactor with Reactive Dynamic Split Animation ──
        let scene, camera, renderer;
        let upperHemisphere, lowerHemisphere, innerPlasmaCore, particleSystem, rayGroup, orbitalRings = [];
        let isSpeaking = false;
        let speakIntensity = 0.0;
        let splitProgress = 0.0;     // 0.0 = compact core, 1.0 = split open reactor
        let targetSplit = 0.0;
        let gyroSpinSpeed = 1.0;

        function initThree() {
            const canvas = document.getElementById('bg-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030201, 0.002);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 8.5;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xff5500, 0.7);
            scene.add(ambientLight);

            const coreLight = new THREE.PointLight(0xffaa00, 4.0, 30);
            coreLight.position.set(0, 0, 0);
            scene.add(coreLight);

            // 1. Central Supernova Plasma Star (revealed when split)
            const plasmaGeo = new THREE.SphereGeometry(0.65, 32, 32);
            const plasmaMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.95
            });
            innerPlasmaCore = new THREE.Mesh(plasmaGeo, plasmaMat);
            scene.add(innerPlasmaCore);

            // 2. Upper Hemisphere Shell (Splits Upward on Gesture)
            const upperGeo = new THREE.SphereGeometry(2.0, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const shellMatUpper = new THREE.MeshBasicMaterial({
                color: 0xff8800,
                wireframe: true,
                transparent: true,
                opacity: 0.65
            });
            upperHemisphere = new THREE.Mesh(upperGeo, shellMatUpper);
            scene.add(upperHemisphere);

            // 3. Lower Hemisphere Shell (Splits Downward on Gesture)
            const lowerGeo = new THREE.SphereGeometry(2.0, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const shellMatLower = new THREE.MeshBasicMaterial({
                color: 0xff7700,
                wireframe: true,
                transparent: true,
                opacity: 0.65
            });
            lowerHemisphere = new THREE.Mesh(lowerGeo, shellMatLower);
            scene.add(lowerHemisphere);

            // 4. Radiating Laser Energy Spikes (18 Spikes)
            rayGroup = new THREE.Group();
            const rayMat = new THREE.LineBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.85 });
            for (let i = 0; i < 18; i++) {
                const phi = Math.acos(-1 + (2 * i) / 18);
                const theta = Math.sqrt(18 * Math.PI) * phi;
                const dir = new THREE.Vector3(
                    Math.cos(theta) * Math.sin(phi),
                    Math.sin(theta) * Math.sin(phi),
                    Math.cos(phi)
                ).normalize();

                const points = [
                    dir.clone().multiplyScalar(0.7),
                    dir.clone().multiplyScalar(3.4 + Math.random() * 0.9)
                ];
                const rayGeo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(rayGeo, rayMat);
                rayGroup.add(line);
            }
            scene.add(rayGroup);

            // 5. Gimbal Orbital Expansion Rings (4 Rings)
            const ringRadii = [2.4, 2.8, 3.2, 3.6];
            const ringColors = [0xffbb00, 0xff8800, 0xff5500, 0xff3300];
            ringRadii.forEach((r, idx) => {
                const ringGeo = new THREE.TorusGeometry(r, 0.022, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: ringColors[idx],
                    transparent: true,
                    opacity: 0.7
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / (2 + idx * 0.4);
                ring.rotation.y = idx * 0.7;
                orbitalRings.push(ring);
                scene.add(ring);
            });

            // 6. 1500 Orbiting Golden Sparkle Particles
            const particleCount = 1500;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const radius = 2.1 + Math.random() * 3.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0xffcc33,
                size: 0.048,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Smooth Speaking Energy & Split Transition
            const targetIntensity = isSpeaking ? 1.0 : 0.0;
            speakIntensity += (targetIntensity - speakIntensity) * 0.12;
            splitProgress += (targetSplit - splitProgress) * 0.08;

            const pulse = Math.sin(elapsedTime * (isSpeaking ? 7.5 : 2.5)) * 0.08;
            const energyScale = 1.0 + pulse + speakIntensity * 0.25;

            // Dynamic Split Separation (Hemispheres move apart vertically)
            const splitDistance = splitProgress * 1.35;
            if (upperHemisphere) {
                upperHemisphere.position.y = splitDistance;
                upperHemisphere.rotation.y += 0.006 * gyroSpinSpeed + speakIntensity * 0.02;
                upperHemisphere.rotation.x = pulse * 0.5;
                upperHemisphere.scale.set(energyScale, energyScale, energyScale);
            }
            if (lowerHemisphere) {
                lowerHemisphere.position.y = -splitDistance;
                lowerHemisphere.rotation.y -= 0.006 * gyroSpinSpeed + speakIntensity * 0.02;
                lowerHemisphere.rotation.x = -pulse * 0.5;
                lowerHemisphere.scale.set(energyScale, energyScale, energyScale);
            }

            // Central Plasma Core Flares when Split or Speaking
            if (innerPlasmaCore) {
                const coreScale = 1.0 + splitProgress * 0.8 + speakIntensity * 0.5 + Math.sin(elapsedTime * 9.0) * 0.15;
                innerPlasmaCore.scale.set(coreScale, coreScale, coreScale);
                innerPlasmaCore.material.color.setHex(splitProgress > 0.3 || isSpeaking ? 0xffffff : 0xffeedd);
            }

            // Lasers Spike Outward
            if (rayGroup) {
                const rayScale = energyScale * (1.0 + splitProgress * 0.4);
                rayGroup.rotation.y += 0.005 * gyroSpinSpeed + speakIntensity * 0.015;
                rayGroup.scale.set(rayScale, rayScale, rayScale);
            }

            // Orbital Rings Expand Outward when Split
            orbitalRings.forEach((ring, idx) => {
                const ringScale = 1.0 + splitProgress * (0.3 + idx * 0.15);
                ring.scale.set(ringScale, ringScale, ringScale);
                ring.rotation.x += (0.008 * (idx + 1)) * gyroSpinSpeed + speakIntensity * 0.02;
                ring.rotation.y += (0.005 * (idx + 1)) * gyroSpinSpeed + speakIntensity * 0.015;
            });

            if (particleSystem) {
                particleSystem.rotation.y -= 0.004 * gyroSpinSpeed + speakIntensity * 0.012;
            }

            renderer.render(scene, camera);
        }

        // ── Gesture Reaction Trigger Function ─────────────────────────────────
        function onGestureDetected(gestureName) {
            const badge = document.getElementById('ai-state-indicator');
            const bubble = document.getElementById('voice-response');

            badge.classList.add('gesture-active');

            if (gestureName === 'OPEN_PALM' || gestureName === 'WAKE') {
                targetSplit = 1.0;
                gyroSpinSpeed = 2.5;
                badge.innerText = `🤚 GESTURE: OPEN PALM ● REACTOR SPLIT`;
                bubble.innerText = "Core Deployed: Waiting for command confirmation.";
                setTimeout(() => { targetSplit = 0.0; gyroSpinSpeed = 1.0; badge.classList.remove('gesture-active'); }, 4000);
            } else if (gestureName === 'CLOSED_FIST') {
                targetSplit = 0.0;
                gyroSpinSpeed = 0.2;
                badge.innerText = `✊ GESTURE: CLOSED FIST ● EMERGENCY STOP`;
                bubble.innerText = "Core Compacted: Actions Cancelled.";
                setTimeout(() => { gyroSpinSpeed = 1.0; badge.classList.remove('gesture-active'); }, 3000);
            } else if (gestureName === 'TWO_FINGERS') {
                gyroSpinSpeed = 3.5;
                badge.innerText = `✌️ GESTURE: TWO FINGERS ● GYRO SCROLL`;
                setTimeout(() => { gyroSpinSpeed = 1.0; badge.classList.remove('gesture-active'); }, 2500);
            } else {
                targetSplit = 0.6;
                setTimeout(() => { targetSplit = 0.0; badge.classList.remove('gesture-active'); }, 2000);
            }
        }

        function triggerSplitDemo() {
            targetSplit = targetSplit > 0.5 ? 0.0 : 1.0;
            onGestureDetected(targetSplit > 0.5 ? 'OPEN_PALM' : 'CLOSED_FIST');
        }

        // ── Speaking Highlight & Backend Event Listener ───────────────────────
        function setSpeakingState(speaking, text = "") {
            isSpeaking = speaking;
            const badge = document.getElementById('ai-state-indicator');
            const bubble = document.getElementById('voice-response');

            if (speaking) {
                badge.innerText = "⚡ J.A.R.V.I.S. SPEAKING...";
                badge.classList.add('speaking');
                bubble.classList.add('active');
                if (text) bubble.innerText = `"${text}"`;
            } else {
                badge.innerText = "SYSTEM READY ● ONLINE";
                badge.classList.remove('speaking');
                bubble.classList.remove('active');
            }
        }

        // Real-time status polling only when running in hosted browser mode
        async function pollStatus() {
            if (window.pywebview || window.location.protocol === 'file:') return;
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    if (data.state === 'SPEAKING') {
                        setSpeakingState(true);
                    } else if (isSpeaking) {
                        setSpeakingState(false);
                    }
                }
            } catch (e) {}
        }
        if (!window.pywebview && window.location.protocol !== 'file:') {
            setInterval(pollStatus, 2000);
        }

        // ── User Input & Command Bridge ──────────────────────────────────────
        async function sendCommand() {
            const input = document.getElementById('cmd-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            setSpeakingState(false);
            const bubble = document.getElementById('voice-response');
            bubble.innerText = `Executing: "${text}"...`;

            // Call PyWebView native Python API if running as standalone desktop app
            if (window.pywebview && window.pywebview.api) {
                const reply = await window.pywebview.api.send_command(text);
                setSpeakingState(true, reply);
                setTimeout(() => setSpeakingState(false), Math.max(3000, reply.length * 70));
                return;
            }

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (res.ok) {
                    const data = await res.json();
                    const reply = data.message || "Command executed.";
                    setSpeakingState(true, reply);
                    setTimeout(() => setSpeakingState(false), Math.max(3000, reply.length * 70));
                }
            } catch (e) {
                bubble.innerText = `Executed: "${text}"`;
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function toggleVoiceMode() {
            const mic = document.getElementById('mic-toggle');
            mic.classList.toggle('recording');
            const bubble = document.getElementById('voice-response');
            bubble.innerText = mic.classList.contains('recording') 
                ? "🎙️ Listening... Speak anytime in Hindi/English." 
                : "Voice mode paused.";
        }

        function setTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            const bubble = document.getElementById('voice-response');
            if (tab === 'home') bubble.innerText = "Home View: 3D Core Reactor Active.";
            if (tab === 'chat') bubble.innerText = "Chat View: Type below or speak to interact.";
            if (tab === 'dashboard') bubble.innerText = "Dashboard View: 95 Registered Apps, Neural Voice Engine Active.";
        }

        window.onload = initThree;
    </script>
</body>
</html>
